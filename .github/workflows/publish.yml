name: Publish

# TASK-806: publishes `production-change-agent` to npm when a version tag is
# pushed (`v0.1.0`), with provenance, from the same build CI proves. Free:
# npm's trusted publishing (OIDC) needs no long-lived token — configure the
# package on npmjs.com to trust this repository and workflow — or set the
# NPM_TOKEN secret and it is used instead. The tag must match the version in
# apps/cli/package.json; a mismatch fails before anything is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package v$version"; exit 1; }

      - name: Build the console and the package
        run: pnpm --filter @pca/web build && pnpm --filter production-change-agent build

      - name: Smoke the packed tarball
        run: pnpm --filter production-change-agent smoke

      - name: Publish with provenance
        run: pnpm --filter production-change-agent publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
