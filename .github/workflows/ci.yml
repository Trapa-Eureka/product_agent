name: CI

# TASK-605 (TESTING.md §12): the repository is hosted on GitHub, so this is
# the pipeline that actually runs. It does one thing — `pnpm run verify`,
# the same completion gate a contributor runs locally — so there is exactly
# one place the step order and pass/fail logic live (scripts/verify.mjs),
# not a second copy hand-kept in sync here. No external service: the
# integration suite's Mongo is `mongodb-memory-server` (an in-process
# binary, downloaded once), and the E2E suite's API/web servers are both
# started and torn down by Playwright itself against a memory store.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TASK-927 (SEC-016 / AUD-019): the workflow token can read the repository
# and nothing else — verify needs no write. Actions are pinned to reviewed
# commit SHAs (the tag they correspond to is in the trailing comment), so a
# moved or compromised tag cannot change what runs here; Dependabot
# (.github/dependabot.yml) proposes SHA updates.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TASK-925 (SEC-012 / AUD-018): a known advisory at moderate or above in
      # the resolved dependency graph fails the build. Runs here and not in
      # `verify`, because `verify` must work offline and this needs the
      # advisory database.
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Install Playwright's Chromium (TASK-604)
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm run verify

  # TASK-930 (AUD-015): the deployable artifact is built from the same
  # checkout and proved to boot the documented demo before anything merges.
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the image
        run: docker build -t production-change-agent:ci .

      - name: Boot the demo from the image and check health
        run: |
          docker run -d --name pca -p 3000:3000 -e PCA_DEMO_MODE=true -e PCA_STORAGE=memory production-change-agent:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/auth/demo-session | grep -q '"token"'
          # The API logs JSON lines to stderr; docker logs keeps the streams apart.
          docker logs pca 2>&1 | grep -q '"event":"api_start"'
          docker stop pca
